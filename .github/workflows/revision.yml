# Revisión automática de cada push y PR: tipos, lint, build, pruebas del
# backend sobre una base creada con las migraciones, y que las migraciones
# nuevas solo agreguen (ver scripts/revisar_migraciones.py).
name: Revisión

on:
  push:
    branches: [develop, master, administrativo]
  pull_request:
    branches: [develop, master, administrativo]

jobs:
  frontend:
    runs-on: ubuntu-latest
    env:
      # prisma generate (postinstall) la exige aunque no se conecte.
      DATABASE_URL: postgresql://sin-conexion@localhost:5432/build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgrouting/pgrouting:17-3.5-3.8
        env:
          POSTGRES_USER: pruebas
          POSTGRES_PASSWORD: pruebas
          POSTGRES_DB: pruebas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pruebas"
          --health-interval 5s
          --health-retries 20
    env:
      PRUEBAS_POSTGRES_URL: postgresql://pruebas:pruebas@localhost:5432/pruebas
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Pruebas
        working-directory: backend
        run: python -m pytest tests -q
      - name: Migraciones nuevas solo agregan
        if: github.event_name == 'pull_request'
        run: python scripts/revisar_migraciones.py origin/${{ github.base_ref }}
